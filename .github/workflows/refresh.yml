name: Refresh lottery data

# Records the prize counts twice a day and commits them. The commit triggers a
# Vercel deploy, so the bundled snapshot and the claim history stay current.
on:
  schedule:
    - cron: '17 6,18 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency: refresh

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run refresh
      - name: Commit if anything changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data
          git diff --cached --quiet || git commit -m "Refresh lottery data"
          git push
